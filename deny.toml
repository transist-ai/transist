[graph]
all-features = true

[advisories]
version = 2

[licenses]
version = 2
confidence-threshold = 0.93
allow = [
  "Apache-2.0",
  "MPL-2.0",
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "CDLA-Permissive-2.0",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "BSL-1.0",
]

# Accept permissive MIT No Attribution only for this jsonschema dependency.
# This dependency exception does not change the project's MPL-2.0 license.
[[licenses.exceptions]]
name = "borrow-or-share"
version = "=0.2.4"
allow = ["MIT-0"]

[bans]
multiple-versions = "warn"
deny = [
  { name = "serde_yaml" },
  { name = "serde_yml" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
