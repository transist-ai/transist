schema: transist.plugin.v1
id: markdown.local
version: 0.1.0
adapter: process
default_provider_kind: local
entrypoint:
  type: process
  command: plugin.py
package:
  files:
    - plugin.py
    - schemas/format.input.schema.json
    - schemas/format.output.schema.json
    - schemas/write_file.input.schema.json
    - schemas/write_file.output.schema.json
actions:
  - name: format
    input_schema: schemas/format.input.schema.json
    output_schema: schemas/format.output.schema.json
    secret_inputs: []
    bindings: {}
  - name: write_file
    input_schema: schemas/write_file.input.schema.json
    output_schema: schemas/write_file.output.schema.json
    secret_inputs: []
    bindings: {}
capabilities:
  supports_cancel: false
  supports_health: false
  supports_artifact_hints: true
  supports_evidence_hints: false
