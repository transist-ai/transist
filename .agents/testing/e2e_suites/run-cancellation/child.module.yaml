schema: transist.module.v1
id: child
version: 0.1.0
steps:
  - id: wait
    uses: process:shell/exec
    with:
      command: sh
      args:
        - -c
        - |
          touch main-started
          for attempt in $(seq 1 2400); do
            if [ -f main-release ]; then
              touch main-completed
              exit 0
            fi
            sleep 0.05
          done
          exit 1
cleanup:
  - id: child_teardown_must_not_run
    when: [canceled]
    uses: process:shell/exec
    with:
      command: sh
      args: ["-c", "touch child-cleanup-ran; exit 1"]
