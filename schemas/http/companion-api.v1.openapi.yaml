openapi: 3.0.3
info:
  title: Transist Companion Inspection API
  version: 1.0.0
  description: |
    Read-only local inspection API exposed by `transist-server`. Every route is
    `GET`; there are no mutating routes. The companion server does not execute,
    resume, replay, approve gates, or mutate runs. Those operations live in the
    `transist` CLI. `v1` in the path prefix and schema identifiers is a format
    version, not a SemVer 1.0 stability promise.
  contact:
    name: Transist
    url: https://transist.ai
  license:
    name: MPL-2.0
    url: https://www.mozilla.org/MPL/2.0/
servers:
  - url: http://127.0.0.1:7777
    description: Default loopback bind for the companion server.
security: []
paths:
  /api/v1/runs:
    get:
      operationId: listRuns
      summary: List top-level runs
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - name: scope
          in: query
          schema: { type: string, enum: [roots, all], default: roots }
        - name: status
          in: query
          schema:
            type: string
            enum: [created, planned, running, waiting, blocked, success, failed, canceled]
        - { name: workflow, in: query, schema: { type: string } }
        - { name: created_after, in: query, schema: { type: string, format: date-time } }
        - { name: created_before, in: query, schema: { type: string, format: date-time } }
        - { name: updated_after, in: query, schema: { type: string, format: date-time } }
        - { name: updated_before, in: query, schema: { type: string, format: date-time } }
      responses:
        "200": { $ref: "#/components/responses/RunList" }
        "400": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
  /api/v1/runs/{run_id}:
    get:
      operationId: getRun
      summary: Get run detail
      parameters: [{ $ref: "#/components/parameters/RunId" }]
      responses:
        "200": { $ref: "#/components/responses/RunDetail" }
        "404": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
  /api/v1/runs/{run_id}/trust:
    get:
      operationId: getRunTrust
      summary: Get run trust and provenance summary
      parameters: [{ $ref: "#/components/parameters/RunId" }]
      responses:
        "200": { $ref: "#/components/responses/TrustSummary" }
        "404": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
  /api/v1/runs/{run_id}/locality:
    get:
      operationId: getRunLocality
      summary: Get provider locality and external-transfer summary
      parameters: [{ $ref: "#/components/parameters/RunId" }]
      responses:
        "200": { $ref: "#/components/responses/LocalitySummary" }
        "404": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
  /api/v1/runs/{run_id}/events:
    get:
      operationId: listRunEvents
      summary: List durable run events
      parameters:
        - { $ref: "#/components/parameters/RunId" }
        - { $ref: "#/components/parameters/Limit" }
        - { name: before, in: query, schema: { type: integer, format: int64, minimum: 0 } }
        - { name: after, in: query, schema: { type: integer, format: int64, minimum: 0 } }
        - { name: order, in: query, schema: { type: string, enum: [asc, desc], default: desc } }
      responses:
        "200": { $ref: "#/components/responses/EventList" }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
  /api/v1/runs/{run_id}/steps:
    get:
      operationId: listRunSteps
      summary: List steps for a run
      parameters: [{ $ref: "#/components/parameters/RunId" }]
      responses:
        "200": { $ref: "#/components/responses/StepList" }
        "404": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
  /api/v1/runs/{run_id}/steps/{step_id}:
    get:
      operationId: getRunStep
      summary: Get step detail
      description: >-
        Existing fields describe latest step state. Output identifies the selected
        execution independently. Missing run, step, or explicit execution returns
        404 resource_not_found; invalid selectors return 400 invalid_request;
        unreadable, malformed, or identity-mismatched storage returns the sanitized
        500 storage_query_failure problem. Reads never modify persisted data.
      parameters:
        - { $ref: "#/components/parameters/RunId" }
        - { $ref: "#/components/parameters/StepId" }
        - name: execution
          in: query
          required: false
          description: >-
            Omitted means latest. Accept exactly latest or ASCII decimal digits
            representing a positive u32 (1 through 4294967295); leading zeros are
            accepted. Empty, whitespace, signs, zero, nonnumeric, and overflow
            values return 400 invalid_request. Explicit selection requires a
            record or a matching latest state-result fallback.
          schema:
            type: string
            default: latest
            pattern: '^(latest|0*[1-9][0-9]*)$'
          examples:
            latest: { value: latest }
            historical: { value: "2" }
      responses:
        "200": { $ref: "#/components/responses/StepDetail" }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
  /api/v1/runs/{run_id}/gates:
    get:
      operationId: listRunGates
      summary: List manual approval gates for a run
      parameters: [{ $ref: "#/components/parameters/RunId" }]
      responses:
        "200": { $ref: "#/components/responses/GateList" }
        "404": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
  /api/v1/runs/{run_id}/documents/{revision_id}:
    get:
      operationId: getRunDocument
      summary: Inspect one committed managed document revision
      description: Opaque revision identity scoped to the run's strict physical root lineage; never follows replay ancestry or accepts host paths.
      parameters:
        - { $ref: "#/components/parameters/RunId" }
        - { $ref: "#/components/parameters/RevisionId" }
      responses:
        "200":
          description: Exact revision metadata and opaque content links, including tree members.
          content: { application/json: { schema: { $ref: "#/components/schemas/ManagedDocument" } } }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
  /api/v1/runs/{run_id}/documents/{revision_id}/content:
    get:
      operationId: getRunDocumentContent
      summary: Download exact immutable document or tree member bytes
      description: Returns file bytes or a canonical tree manifest. Optional member_id selects an exact manifest member by opaque ID; no filesystem path selector is accepted. Uses the server's existing authenticated-proxy boundary.
      parameters:
        - { $ref: "#/components/parameters/RunId" }
        - { $ref: "#/components/parameters/RevisionId" }
        - name: member_id
          in: query
          schema: { type: string, pattern: "^[a-f0-9]{64}$" }
          description: Opaque member identity obtained from revision metadata, scoped to this revision.
      responses:
        "200": { $ref: "#/components/responses/BlobContent" }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
  /api/v1/runs/{run_id}/failures:
    get:
      operationId: listRunFailures
      summary: List classified failure records for a run
      parameters: [{ $ref: "#/components/parameters/RunId" }]
      responses:
        "200": { $ref: "#/components/responses/FailureList" }
        "404": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
  /api/v1/runs/{run_id}/failures/{failure_id}:
    get:
      operationId: getRunFailure
      summary: Get one classified failure record
      parameters:
        - { $ref: "#/components/parameters/RunId" }
        - { $ref: "#/components/parameters/FailureId" }
      responses:
        "200": { $ref: "#/components/responses/FailureDetail" }
        "404": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
  /api/v1/runs/{run_id}/artifacts:
    get:
      operationId: listRunArtifacts
      summary: List artifacts for a run
      parameters:
        - { $ref: "#/components/parameters/RunId" }
        - { name: scope, in: query, schema: { type: string, enum: [self, subtree], default: self } }
      responses:
        "200": { $ref: "#/components/responses/ArtifactList" }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
  /api/v1/runs/{run_id}/artifacts/{artifact_id}:
    get:
      operationId: getRunArtifact
      summary: Get artifact metadata
      parameters:
        - { $ref: "#/components/parameters/RunId" }
        - { $ref: "#/components/parameters/ArtifactId" }
      responses:
        "200": { $ref: "#/components/responses/ArtifactDetail" }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
  /api/v1/runs/{run_id}/artifacts/{artifact_id}/content:
    get:
      operationId: getRunArtifactContent
      summary: Download artifact content
      parameters:
        - { $ref: "#/components/parameters/RunId" }
        - { $ref: "#/components/parameters/ArtifactId" }
      responses:
        "200": { $ref: "#/components/responses/BlobContent" }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
  /api/v1/runs/{run_id}/evidence:
    get:
      operationId: listRunEvidence
      summary: List evidence for a run
      parameters:
        - { $ref: "#/components/parameters/RunId" }
        - { name: scope, in: query, schema: { type: string, enum: [self, subtree], default: self } }
      responses:
        "200": { $ref: "#/components/responses/EvidenceList" }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
  /api/v1/runs/{run_id}/evidence/{evidence_id}:
    get:
      operationId: getRunEvidence
      summary: Get evidence metadata
      parameters:
        - { $ref: "#/components/parameters/RunId" }
        - { $ref: "#/components/parameters/EvidenceId" }
      responses:
        "200": { $ref: "#/components/responses/EvidenceDetail" }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
  /api/v1/runs/{run_id}/evidence/{evidence_id}/content:
    get:
      operationId: getRunEvidenceContent
      summary: Download evidence content
      parameters:
        - { $ref: "#/components/parameters/RunId" }
        - { $ref: "#/components/parameters/EvidenceId" }
      responses:
        "200": { $ref: "#/components/responses/BlobContent" }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
  /api/v1/runs/{run_id}/workflow-files/{workflow_file_id}:
    get:
      operationId: getRunWorkflowFile
      summary: Get workflow file metadata
      parameters:
        - { $ref: "#/components/parameters/RunId" }
        - { $ref: "#/components/parameters/WorkflowFileId" }
      responses:
        "200": { $ref: "#/components/responses/WorkflowFileDetail" }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
  /api/v1/runs/{run_id}/workflow-files/{workflow_file_id}/content:
    get:
      operationId: getRunWorkflowFileContent
      summary: Download workflow file content
      parameters:
        - { $ref: "#/components/parameters/RunId" }
        - { $ref: "#/components/parameters/WorkflowFileId" }
      responses:
        "200": { $ref: "#/components/responses/BlobContent" }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
  /api/v1/workflows:
    get:
      operationId: listWorkflows
      summary: List discoverable workflows
      parameters:
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Offset" }
      responses:
        "200": { $ref: "#/components/responses/WorkflowList" }
        "400": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
  /api/v1/workflows/{workflow_ref}:
    get:
      operationId: getWorkflow
      summary: Get workflow detail
      parameters: [{ $ref: "#/components/parameters/WorkflowRef" }]
      responses:
        "200": { $ref: "#/components/responses/WorkflowDetail" }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
  /api/v1/workflows/{workflow_ref}/source:
    get:
      operationId: getWorkflowSource
      summary: Get raw workflow source
      parameters: [{ $ref: "#/components/parameters/WorkflowRef" }]
      responses:
        "200": { $ref: "#/components/responses/InlineContent" }
        "400": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
  /api/v1/workflows/{workflow_ref}/compiled-recipe:
    get:
      operationId: getWorkflowCompiledRecipe
      summary: Get the compiled recipe for a workflow
      parameters: [{ $ref: "#/components/parameters/WorkflowRef" }]
      responses:
        "200": { $ref: "#/components/responses/InlineContent" }
        "400": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
components:
  parameters:
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 0 }
    Offset:
      name: offset
      in: query
      schema: { type: integer, minimum: 0, default: 0 }
    RunId: { name: run_id, in: path, required: true, schema: { type: string } }
    RevisionId:
      name: revision_id
      in: path
      required: true
      schema: { type: string, pattern: "^[a-f0-9]{64}$" }
      description: Opaque committed revision identity; use supplied links, never decode as a storage path.
    StepId: { name: step_id, in: path, required: true, schema: { type: string } }
    FailureId: { name: failure_id, in: path, required: true, schema: { type: string } }
    ArtifactId: { name: artifact_id, in: path, required: true, schema: { type: string } }
    EvidenceId: { name: evidence_id, in: path, required: true, schema: { type: string } }
    WorkflowFileId:
      name: workflow_file_id
      in: path
      required: true
      schema: { type: string, pattern: "^wf_[0-9a-f]{64}$" }
      description: Stable opaque workflow-file locator. Do not decode it or treat it as a path.
    WorkflowRef:
      name: workflow_ref
      in: path
      required: true
      schema: { type: string, pattern: "^.+@.+$" }
      description: Workflow reference in `<id>@<version>` form.
  responses:
    RunList:
      description: Paginated run list with lightweight metrics.
      content:
        application/json: { schema: { $ref: "#/components/schemas/RunList" } }
    RunDetail:
      description: Structured run detail with summary metrics and trust/locality panels.
      content: { application/json: { schema: { $ref: "#/components/schemas/RunDetail" } } }
    TrustSummary:
      description: Trust-decision and signature summary for the run tree.
      content: { application/json: { schema: { $ref: "#/components/schemas/TrustSummary" } } }
    LocalitySummary:
      description: Provider locality and external-transfer summary for the run tree.
      content: { application/json: { schema: { $ref: "#/components/schemas/LocalitySummary" } } }
    EventList:
      description: Ordered run event list with pagination.
      content: { application/json: { schema: { $ref: "#/components/schemas/EventList" } } }
    StepList:
      description: Step summary list for one run.
      content: { application/json: { schema: { $ref: "#/components/schemas/StepList" } } }
    StepDetail:
      description: Step detail with usage and numeric metrics.
      content: { application/json: { schema: { $ref: "#/components/schemas/StepDetail" } } }
    GateList:
      description: Manual approval gates for a run.
      content: { application/json: { schema: { $ref: "#/components/schemas/GateList" } } }
    FailureList:
      description: Classified failure records for a run.
      content: { application/json: { schema: { $ref: "#/components/schemas/FailureList" } } }
    FailureDetail:
      description: One classified failure record.
      content: { application/json: { schema: { $ref: "#/components/schemas/Failure" } } }
    ArtifactList:
      description: Artifact metadata list.
      content: { application/json: { schema: { $ref: "#/components/schemas/ArtifactList" } } }
    ArtifactDetail:
      description: Metadata for one artifact.
      content: { application/json: { schema: { $ref: "#/components/schemas/ArtifactMetadata" } } }
    EvidenceList:
      description: Evidence metadata list.
      content: { application/json: { schema: { $ref: "#/components/schemas/EvidenceList" } } }
    EvidenceDetail:
      description: Metadata for one evidence blob.
      content: { application/json: { schema: { $ref: "#/components/schemas/EvidenceMetadata" } } }
    WorkflowFileDetail:
      description: Metadata for one workflow file.
      content: { application/json: { schema: { $ref: "#/components/schemas/WorkflowFileMetadata" } } }
    BlobContent:
      description: Binary content with an inferred media type and attachment disposition.
      content:
        "*/*": { schema: { type: string, format: binary } }
    InlineContent:
      description: UTF-8 workflow source or compiled recipe content. Invalid UTF-8 returns `422 invalid_text_encoding` in the standard problem envelope.
      content:
        text/yaml; charset=utf-8: { schema: { type: string } }
        application/json: { schema: { type: string } }
        text/plain; charset=utf-8: { schema: { type: string } }
    WorkflowList:
      description: Paginated discoverable workflow list.
      content: { application/json: { schema: { $ref: "#/components/schemas/WorkflowList" } } }
    WorkflowDetail:
      description: Workflow detail with inputs and step graph.
      content: { application/json: { schema: { $ref: "#/components/schemas/WorkflowDetail" } } }
    Problem:
      description: Canonical problem detail envelope.
      content: { application/json: { schema: { $ref: "#/components/schemas/ProblemEnvelope" } } }
  schemas:
    Pagination:
      type: object
      additionalProperties: false
      required: [total, limit, offset, has_more]
      properties:
        total: { type: integer, minimum: 0 }
        limit: { type: integer, minimum: 0 }
        offset: { type: integer, minimum: 0 }
        has_more: { type: boolean }
    ProblemEnvelope:
      type: object
      additionalProperties: false
      required: [error]
      properties: { error: { $ref: "#/components/schemas/ErrorBody" } }
    ErrorBody:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
    JsonValue:
      description: Arbitrary persisted JSON with host-path strings redacted at the HTTP transport boundary.
      anyOf:
        - { type: string, nullable: true }
        - { type: string }
        - { type: number }
        - { type: boolean }
        - { $ref: "#/components/schemas/JsonObject" }
        - { $ref: "#/components/schemas/JsonArray" }
    JsonObject:
      description: Arbitrary persisted JSON object retained as open data by the runtime; host-path strings are redacted recursively in API responses.
      type: object
      additionalProperties: { $ref: "#/components/schemas/JsonValue" }
    JsonArray:
      description: Arbitrary persisted JSON array whose host-path strings are redacted recursively in API responses.
      type: array
      items: { $ref: "#/components/schemas/JsonValue" }
    ResourceLinks:
      type: object
      additionalProperties: false
      required: [self_url]
      properties:
        self_url: { type: string }
        events: { type: string, nullable: true }
        steps: { type: string, nullable: true }
        gates: { type: string, nullable: true }
        artifacts: { type: string, nullable: true }
        evidence: { type: string, nullable: true }
    RunListMetrics:
      type: object
      additionalProperties: false
      required: [run_id, total_step_executions, total_artifacts_produced, total_evidence_files_produced]
      properties:
        run_id: { type: string }
        total_duration_ms: { type: integer, minimum: 0, nullable: true }
        wall_clock_duration_ms: { type: integer, minimum: 0, nullable: true }
        active_execution_duration_ms: { type: integer, minimum: 0, nullable: true }
        blocked_wait_duration_ms: { type: integer, minimum: 0, nullable: true }
        total_step_executions: { type: integer, minimum: 0 }
        total_artifacts_produced: { type: integer, minimum: 0 }
        total_evidence_files_produced: { type: integer, minimum: 0 }
        total_tokens: { type: integer, minimum: 0, nullable: true }
    RunSummary:
      type: object
      additionalProperties: false
      required: [run_id, workflow_id, workflow_version, status, created_at, updated_at, has_blocked_gates, has_artifacts, has_events, artifact_count, evidence_count, root_run_id, links]
      properties:
        run_id: { type: string }
        workflow_id: { type: string }
        workflow_version: { type: string }
        status: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        started_at: { type: string, format: date-time, nullable: true }
        finished_at: { type: string, format: date-time, nullable: true }
        current_step_id: { type: string, nullable: true }
        has_blocked_gates: { type: boolean }
        has_artifacts: { type: boolean }
        has_events: { type: boolean }
        artifact_count: { type: integer, minimum: 0 }
        evidence_count: { type: integer, minimum: 0 }
        root_run_id: { type: string }
        parent_run_id: { type: string, nullable: true }
        metrics: { $ref: "#/components/schemas/RunListMetrics" }
        links: { $ref: "#/components/schemas/ResourceLinks" }
    CurrentStep:
      type: object
      additionalProperties: false
      required: [step_id, status]
      properties:
        step_id: { type: string }
        status: { type: string }
    Count:
      type: object
      additionalProperties: false
      required: [count]
      properties: { count: { type: integer, minimum: 0 } }
    EventCount:
      type: object
      additionalProperties: false
      required: [count]
      properties:
        count: { type: integer, minimum: 0 }
        latest_event_id: { type: string, nullable: true }
    PreflightFailedCheck:
      type: object
      additionalProperties: false
      required: [kind, message]
      properties:
        kind: { type: string }
        message: { type: string }
        step_ids: { type: array, items: { type: string } }
        plugin_id: { type: string, nullable: true }
        action: { type: string, nullable: true }
    PreflightSummary:
      type: object
      additionalProperties: false
      required: [status, checked_at, blocker_count, warning_count]
      properties:
        status: { type: string }
        checked_at: { type: string, format: date-time }
        blocker_count: { type: integer, minimum: 0 }
        warning_count: { type: integer, minimum: 0 }
        failed_checks: { type: array, items: { $ref: "#/components/schemas/PreflightFailedCheck" } }
    FilesystemPolicySummary:
      type: object
      additionalProperties: false
      required: [workspace_access]
      properties:
        source: { type: string, nullable: true }
        workspace_root: { type: string, nullable: true, description: "Always '.' when a workspace root exists; host paths are not exposed." }
        workspace_access: { type: object, additionalProperties: false, required: [mode], properties: { mode: { type: string } } }
        read_allow_paths: { type: array, items: { type: string }, description: "Safe relative labels. Host, home-relative, drive-letter, UNC, and traversal paths are never returned." }
        write_allow_paths: { type: array, items: { type: string }, description: "Safe relative labels. Host, home-relative, drive-letter, UNC, and traversal paths are never returned." }
    CleanupStepSummary:
      type: object
      additionalProperties: false
