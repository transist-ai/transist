        is_current_active: { type: boolean }
        executions: { type: array, items: { $ref: "#/components/schemas/StepExecution" } }
        output: { $ref: "#/components/schemas/StepOutput" }
        output_executions:
          type: array
          uniqueItems: true
          description: >-
            Always present, ascending selectable positive ordinals. Includes records
            even without results and a matching latest state-result fallback;
            excludes uncommitted attempts without results.
          items: { type: integer, minimum: 1, maximum: 4294967295 }
        metrics:
          description: Omitted when metrics are unavailable; an existing step remains inspectable.
          allOf: [{ $ref: "#/components/schemas/StepMetrics" }]
    StepOutput:
      type: object
      additionalProperties: false
      required: [execution, status, source, result_present]
      description: >-
        Always emitted. Latest is the maximum of the persisted counter and record
        ordinals, with zero meaning no execution. Immutable records win even without
        a result. Without a latest record, a state result is accepted only when its
        run, step, and ordinal match and step status is success, failed, retry_wait,
        or canceled. Otherwise latest returns a state_snapshot without a result,
        never an earlier attempt's output.
      properties:
        execution:
          type: integer
          minimum: 1
          maximum: 4294967295
          nullable: true
          description: Selected ordinal; null when no execution exists.
        status:
          type: string
          description: Recorded selected status, or current step status when no execution exists.
        source: { type: string, enum: [execution_record, state_snapshot] }
        result_present:
          type: boolean
          description: True for every persisted result, including null and empty or falsy JSON values.
        value:
          description: >-
            Complete recursively host-path-sanitized JSON output. Emitted exactly
            when result_present is true, including explicit JSON null. No truncation.
            Valid HTTP(S) URLs retain existing byte-identical transport behavior.
          allOf: [{ $ref: "#/components/schemas/JsonValue" }]
      oneOf:
        - required: [value]
          properties:
            result_present: { enum: [true] }
        - not:
            required: [value]
            properties:
              value: { $ref: "#/components/schemas/JsonValue" }
          properties:
            result_present: { enum: [false] }
