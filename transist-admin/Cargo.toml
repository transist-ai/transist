[package]
name = "transist-admin"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Admin CLI for Transist: Ed25519 key, signing, verify, and inspection tooling for workflow and plugin trust artifacts."
readme = "README.md"
keywords.workspace = true
categories.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true

[lints]
workspace = true

[lib]
name = "transist_admin"
path = "src/lib.rs"

[[bin]]
name = "transist-admin"
path = "src/main.rs"
doc = false

[dependencies]
anyhow = { workspace = true }
base64 = { workspace = true }
clap = { workspace = true }
ed25519-dalek = { workspace = true, features = ["rand_core"] }
rand = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
yaml_serde = { workspace = true }
sha2 = { workspace = true }
tempfile = { workspace = true }
libc = { workspace = true }
transist-core = { workspace = true }
transist-compiler = { workspace = true }
transist-plugins = { workspace = true }
transist-protocol = { workspace = true }
