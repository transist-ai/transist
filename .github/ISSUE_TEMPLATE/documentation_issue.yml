name: Documentation issue
description: Report incorrect, missing, or unclear documentation.
title: "[Docs]: "
labels:
  - documentation
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve the docs.

        For support boundaries, see [SUPPORT.md](../../SUPPORT.md). For security issues, do not open a normal issue; follow [SECURITY.md](../../SECURITY.md).
  - type: input
    id: page
    attributes:
      label: Affected page or file
      description: Link or path to the doc that needs attention.
      placeholder: docs/guides/getting-started/quickstart.md
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is wrong or missing?
      description: Describe the incorrect, confusing, or missing content.
    validations:
      required: true
  - type: textarea
    id: suggested_fix
    attributes:
      label: Suggested improvement
      description: If you know what would make the page clearer, describe it here.
    validations:
      required: false
