name: Release Publication

on:
  workflow_call:
    inputs:
      candidate_id:
        required: true
        type: string
      source_sha:
        required: true
        type: string

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  review-summary:
    runs-on: ubuntu-24.04
    permissions:
      # GitHub requires contents: write even to GET a private draft release.
      # The summary command is read-only; keep this grant scoped to this job.
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Checkout exact candidate release notes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          path: candidate-source
          fetch-depth: 0
          persist-credentials: false
      - name: Show candidate evidence before approval
        # The notes come from the built candidate, never the orchestration SHA.
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_ID: ${{ inputs.candidate_id }}
        run: python3 scripts/ci/publish_candidate.py summary --candidate-id "$CANDIDATE_ID" --source-directory candidate-source

  publish-release:
    needs: review-summary
    runs-on: ubuntu-24.04
    environment: release-publish
    concurrency:
      group: release-publication-effects
      cancel-in-progress: false
    permissions:
      contents: write
      checks: read
      actions: read
      attestations: read
    steps:
      - name: Checkout trusted publication code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Checkout exact candidate source for verification
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          path: candidate-source
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned verification tools
        run: bash scripts/ci/install_ci_tools.sh verification
      - name: Revalidate, reserve, verify unchanged bytes, tag and publish
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_ID: ${{ inputs.candidate_id }}
        run: python3 scripts/ci/publish_candidate.py publish --candidate-id "$CANDIDATE_ID" --source-directory candidate-source
